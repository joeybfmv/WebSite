# Réveille Supabase chaque jour pour éviter la mise en pause du projet gratuit (inactivité > 7 jours).
# Tourne sur les serveurs de GitHub : aucune visite du site n'est nécessaire.
name: Garder Supabase actif

on:
  schedule:
    - cron: "17 6 * * *"   # tous les jours à 06h17 UTC
  workflow_dispatch:        # bouton « Run workflow » pour tester à la main

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Requête légère vers la base
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -H "apikey: sb_publishable_khjWfBsCfJAttfxdlEZDOQ_i0y1MSp8" \
            "https://elcdvzokmhunvhqwtaod.supabase.co/rest/v1/setlist?select=id&limit=1" > /dev/null
          echo "Supabase répond : projet actif."
