<!doctype html>
<html lang="fr" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR codes — Administration Joɘy</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#050405">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/concerts.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">
  <div id="admin-bar" class="no-print"></div>
  <main class="container admin-main" id="app" hidden>
    <h1 class="no-print">QR codes du site</h1>
    <p class="no-print">Un QR code par page du site, à imprimer ou à télécharger (SVG pour l'impression, PNG pour le web).</p>
    <div class="admin-form no-print">
      <div class="field">
        <label for="q-base">Adresse du site (le QR code ouvrira cette adresse + le nom de la page)</label>
        <input id="q-base" type="url" placeholder="https://…">
      </div>
      <div class="form-actions">
        <button class="btn btn--primary" type="button" id="q-print-all">Imprimer toutes les affiches</button>
      </div>
      <p id="q-error" class="error" role="alert"></p>
    </div>
    <div id="q-groups"></div>
  </main>
  <script type="module" src="js/qr.js"></script>
</body>
</html>
