<!doctype html>
<html lang="fr" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Setlist — Administration Joɘy</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#050405">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/concerts.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">
  <div id="admin-bar"></div>
  <main class="container admin-main" id="app" hidden>
    <div id="admin-status" class="admin-status" role="status" aria-live="polite"></div>
    <h1>Setlist</h1>
    <form id="song-form" class="admin-form" novalidate>
      <fieldset>
        <legend id="song-legend">Ajouter un morceau</legend>
        <div class="form-grid">
          <div class="field"><label for="s-title">Titre *</label><input id="s-title" name="title" type="text" maxlength="160" required></div>
          <div class="field"><label for="s-album">Album (facultatif)</label><input id="s-album" name="album" type="text" maxlength="160"></div>
        </div>
        <label class="switch" for="s-pub"><input id="s-pub" name="is_published" type="checkbox" checked> Visible sur le site</label>
      </fieldset>
      <div class="form-actions">
        <button class="btn btn--primary" type="submit" id="s-save">Ajouter</button>
        <button class="btn btn--ghost" type="button" id="s-cancel" hidden>Annuler</button>
      </div>
    </form>
    <div id="song-list" class="admin-list" aria-live="polite"></div>
  </main>
  <script type="module" src="js/setlist-admin.js"></script>
</body>
</html>
