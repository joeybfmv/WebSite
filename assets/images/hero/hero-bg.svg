<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Fond abstrait : fumée sombre et éclaboussures rouges">
  <!-- Image originale générée pour le site : fumée + éclaboussures rouges. À remplacer par une vraie photo de scène (assets/images/hero/). -->
  <defs>
    <filter id="smoke" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.012" numOctaves="5" seed="7"/>
      <feColorMatrix values="0 0 0 0 .93  0 0 0 0 .9  0 0 0 0 .86  0 0 0 1.6 -.55"/>
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="splat" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" baseFrequency="0.03" numOctaves="3" seed="3" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="40"/>
    </filter>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#d9192b" stop-opacity=".75"/>
      <stop offset=".55" stop-color="#6b0b14" stop-opacity=".45"/>
      <stop offset="1" stop-color="#050405" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050405" stop-opacity=".2"/>
      <stop offset="1" stop-color="#050405" stop-opacity=".95"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#050405"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" filter="url(#smoke)" opacity=".55"/>
  <g filter="url(#splat)" fill="#b0121e" opacity=".85">
    <circle cx="300" cy="620" r="46"/><circle cx="380" cy="560" r="18"/><circle cx="250" cy="700" r="14"/>
    <circle cx="1280" cy="260" r="40"/><circle cx="1350" cy="330" r="16"/><circle cx="1210" cy="190" r="12"/>
    <circle cx="820" cy="780" r="30"/><circle cx="900" cy="730" r="10"/>
  </g>
  <rect width="1600" height="900" fill="url(#fade)"/>
</svg>
